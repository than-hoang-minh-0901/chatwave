<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatWave — Messages</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172033;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
.app{width:min(1050px,100%);height:min(760px,94vh);min-height:560px;background:white;border:1px solid #e4e8f0;border-radius:20px;box-shadow:0 18px 60px #25345b18;display:flex;flex-direction:column;overflow:hidden}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #edf0f5}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}.logo{background:#5b5ce2;color:white;border-radius:12px;width:36px;height:36px;display:grid;place-items:center}
.status{font-size:12px;color:#69748a}.layout{display:flex;flex:1;min-height:0}.sidebar{width:300px;border-right:1px solid #edf0f5;padding:16px;display:flex;flex-direction:column}.section{font-size:11px;letter-spacing:1.2px;font-weight:800;color:#8992a5;margin:5px 5px 13px}
input{font:inherit;outline:none}.search{width:100%;border:1px solid #e6e9f0;background:#f8f9fc;padding:11px 12px;border-radius:11px;margin-bottom:13px}
.people{overflow:auto}.person{width:100%;display:flex;align-items:center;gap:11px;padding:11px 9px;border:0;background:white;border-radius:12px;text-align:left;cursor:pointer}.person:hover,.person.active{background:#f0f0ff}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;flex-shrink:0;background:var(--c)}.person-name{font-weight:700;font-size:14px}.preview{font-size:12px;color:#8992a5;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:185px}
.me{margin-top:auto;padding:14px 4px 2px;border-top:1px solid #edf0f5;display:flex;align-items:center;gap:10px}.me .avatar{background:#6566d9}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}.chathead{height:70px;border-bottom:1px solid #edf0f5;display:flex;align-items:center;padding:0 20px;gap:12px}.chathead strong{font-size:14px}.chatbody{flex:1;overflow:auto;padding:22px;background:#fff}.msg{display:flex;flex-direction:column;gap:5px;margin:12px 0}.msg.mine{align-items:flex-end}.bubble{max-width:78%;padding:11px 15px;border-radius:17px;background:#f0f2f7;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.mine .bubble{background:#5b5ce2;color:white;border-bottom-right-radius:5px}.theirs .bubble{border-bottom-left-radius:5px}.time{font-size:10px;color:#9aa2b2}.composer{padding:14px 17px;border-top:1px solid #edf0f5}.composeform{display:flex;gap:9px;background:#f7f8fb;border:1px solid #e7eaf1;padding:6px;border-radius:13px}.composeform input{flex:1;min-width:0;border:0;background:transparent;padding:8px}.send,.new{border:0;border-radius:10px;padding:10px 16px;background:#5b5ce2;color:white;font-weight:700;cursor:pointer}.new{padding:9px 13px}.hint{text-align:center;color:#a0a7b5;font-size:11px;margin-top:8px}
@media(max-width:650px){body{padding:0}.app{height:100vh;min-height:0;border-radius:0}.sidebar{width:100%;border:0}.layout{position:relative}.chat{display:none}.layout.showchat .sidebar{display:none}.layout.showchat .chat{display:flex}.back{display:inline-block!important}.sidebar{padding:12px}.chatbody{padding:15px}}
.back{display:none;border:0;background:none;font-size:22px;cursor:pointer}
</style></head>
<body><main class="app">
<header><div class="brand"><span class="logo">C</span>ChatWave</div><span class="status">Demo chat · saved in this browser</span></header>
<div class="layout" id="layout">
<aside class="sidebar"><div class="section">MESSAGES</div><input id="search" class="search" placeholder="Search conversations…"><div class="people" id="people"></div><div class="me"><div class="avatar">Y</div><div><b style="font-size:13px">You</b><div class="status">My account · Online</div></div></div></aside>
<section class="chat"><div class="chathead" id="chathead"></div><div class="chatbody" id="messages"></div><div class="composer"><form class="composeform" id="form"><input id="message" placeholder="Write a message…" autocomplete="off"><button class="send">Send ↑</button></form><div class="hint">This is a frontend demo. Messages are stored only in this browser.</div></div></section>
</div></main>
<script>
const initial=[

const initial=[
  {id:1,name:"Alex Morgan",color:"#6875d8",online:true,msgs:[]},
  {id:2,name:"Sophia Lee",color:"#d16b9c",online:true,msgs:[]},
  {id:3,name:"Daniel Kim",color:"#269b8a",online:false,msgs:[]},
  {id:4,name:"Emma Wilson",color:"#d18b45",online:true,msgs:[]}
];

const RESET_KEY="chatwave-demo-cleared-v1";

if(!localStorage.getItem(RESET_KEY)){
  localStorage.removeItem("chatwave-chats");
  localStorage.setItem(RESET_KEY,"yes");
}

let chats;
try {
  chats=JSON.parse(localStorage.getItem("chatwave-chats"))||initial;
} catch {
  chats=initial;
}

];
let chats;try{chats=JSON.parse(localStorage.getItem("chatwave-chats"))||initial}catch{chats=initial}
let selected=1;const $=id=>document.getElementById(id);
function save(){localStorage.setItem("chatwave-chats",JSON.stringify(chats))}
function time(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function drawPeople(){let q=$("search").value.toLowerCase();$("people").innerHTML=chats.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<button class="person ${p.id===selected?"active":""}" data-id="${p.id}"><span class="avatar" style="--c:${p.color}">${p.name[0]}</span><span style="min-width:0"><span class="person-name">${p.name}</span><span class="preview">${p.msgs.at(-1)?.[1]||"Start a conversation"}</span></span></button>`).join("")||'<p class="status">No conversations found.</p>'}
function drawChat(){let p=chats.find(x=>x.id===selected);if(!p)return;$("chathead").innerHTML=`<button class="back" id="back">‹</button><span class="avatar" style="--c:${p.color}">${p.name[0]}</span><span><strong>${p.name}</strong><div class="status">${p.online?"● Online":"Offline"}</div></span>`;$("messages").innerHTML=p.msgs.map(m=>`<div class="msg ${m[0]==="me"?"mine":"theirs"}"><div class="bubble">${escapeHtml(m[1])}</div><span class="time">${m[2]}</span></div>`).join("");$("messages").scrollTop=$("messages").scrollHeight;$("back").onclick=()=>$("layout").classList.remove("showchat")}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function select(id){selected=id;drawPeople();drawChat();$("layout").classList.add("showchat")}
$("people").onclick=e=>{let b=e.target.closest("[data-id]");if(b)select(+b.dataset.id)};$("search").oninput=drawPeople;
$("form").onsubmit=e=>{e.preventDefault();let value=$("message").value.trim(),p=chats.find(x=>x.id===selected);if(!value||!p)return;p.msgs.push(["me",value,time()]);$("message").value="";save();drawPeople();drawChat()};
drawPeople();select(1);
</script></body></html>
